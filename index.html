<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unique Step Outfits | Lucky Spin V3</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Logo -->
    <img src="logo.png" class="logo" alt="Unique Step Outfits">

    <!-- Title -->
    <h1>Lucky Cashback Spin</h1>

    <p class="subtitle">
        Spin & Win Amazing Rewards
    </p>

    <!-- Wheel -->
    <div class="wheel-wrapper">

        <div class="pointer"></div>

        <canvas
            id="wheelCanvas"
            width="320"
            height="320">
        </canvas>

    </div>

    <!-- Spin Button -->
    <button
        id="spinBtn"
        class="spin-btn"
        onclick="spinWheel()">

        SPIN NOW

    </button>

</div>

<!-- Winner Popup -->

<div id="popup" class="popup">

    <div class="popup-box">

        <h2>🎉 Congratulations!</h2>

        <p id="prizeText"></p>

        <button
            class="close-btn"
            onclick="closePopup()">

            Claim via WhatsApp

        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
